<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Manual Next01</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#D5DDEE;--sf:#fff;--sand:#C6D1E8;--line:#B3C0DD;--ink:#0C1A4B;--mut:#58628A;--brand:#01135D;--red:#B81D2C;--c:#01135D;--f:'Poppins',system-ui,sans-serif}
@media(prefers-color-scheme:dark){:root{--bg:#070C27;--sf:#0F1740;--sand:#1A2457;--line:#2A3670;--ink:#EEF1FF;--mut:#A8B2DB;--brand:#1A4FC3;--red:#FF8A8F}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 var(--f);padding:env(safe-area-inset-top) 0 0}
h1,h2,h3,h4,p{margin:0}h1,h2,h3,h4{line-height:1.2;text-wrap:balance}a{color:inherit}
.wrap{max-width:1180px;margin:auto;padding:0 max(16px,env(safe-area-inset-right)) 0 max(16px,env(safe-area-inset-left))}
.top{position:sticky;top:0;z-index:5;background:var(--sf);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.top .wrap{display:flex;gap:12px;align-items:center;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;text-decoration:none;line-height:1.2}.brand b{font-size:1.05rem}.brand span{font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:var(--mut)}
#q{flex:1;min-width:200px;padding:10px 16px;border:1.5px solid var(--line);border-radius:999px;background:var(--bg);color:var(--ink);font:inherit}
.pdf{background:var(--brand);color:#fff;text-decoration:none;padding:9px 16px;border-radius:999px;font-weight:500;font-size:.88rem}
main{padding-block:24px 56px}
.kicker{font-size:.72rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--red)}
.hero{background:linear-gradient(135deg,#01135D 0%,#0B2A8A 100%);color:#fff;border-radius:16px;padding:36px 28px;margin-bottom:24px}.hero .kicker{color:#F8DC5A}
.hero h1{font-size:clamp(1.7rem,4.6vw,2.6rem);max-width:20ch;margin:8px 0 12px}.hero p{max-width:56ch;color:#C3CCEE}
.mods{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.mcard{display:flex;flex-direction:column;gap:6px;height:100%;text-decoration:none;background:var(--sf);border:1px solid var(--line);border-top:5px solid var(--c);border-radius:14px;padding:18px}
.mcard:hover{border-color:var(--c)}.mcard .mn{font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:var(--mut)}.mcard p{color:var(--mut);font-size:.92rem}
.lay{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto;padding-top:8px}.lay i{font-style:normal;font-size:.68rem;padding:2px 9px;border-radius:999px;background:var(--sand);color:var(--mut);opacity:.6}.lay i.on{background:var(--c);color:#fff;opacity:1}
.mhead{border-left:6px solid var(--c);padding-left:16px;margin-bottom:18px}.mhead>a{font-size:.85rem;color:var(--mut);text-decoration:none}.mhead h1{font-size:clamp(1.6rem,4vw,2.2rem)}.mhead p{color:var(--mut)}
.seg{display:flex;gap:4px;background:var(--sand);padding:4px;border-radius:999px;margin-top:14px;max-width:100%;overflow-x:auto;width:fit-content}
.seg a{white-space:nowrap;text-decoration:none;padding:8px 16px;border-radius:999px;font-size:.9rem;font-weight:500;color:var(--mut)}.seg a[aria-current=true]{background:var(--c);color:#fff}
.layer{display:flex;flex-direction:column;gap:16px}
.block,.guide,details.m{background:var(--sf);border:1px solid var(--line);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:14px}
.block h3{font-size:1.3rem}.flow{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:8px 0}
.flow li{display:flex;align-items:center}.flow li span{background:var(--sand);padding:9px 14px;border-radius:10px;font-weight:600;font-size:.9rem}.flow li.hi span{background:var(--c);color:#fff}.flow li:not(:last-child)::after{content:"→";color:var(--red);font-weight:700;padding-inline:9px}
.chips{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}.chips li{background:var(--sand);border-radius:10px;padding:10px;text-align:center;font-weight:600}.chips li.hi{background:var(--c);color:#fff}
.callout{background:var(--brand);color:#fff;border-radius:12px;padding:16px 18px;display:flex;flex-direction:column;gap:8px}
.details,.terms{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin:0}.details div,.terms div,.fcard{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
dt,.fcard h4,.how h4,.conn h4,.tips b,.cols h4{font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;font-weight:600;color:var(--red)}dd{margin:4px 0 0}
.rules{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}.rules li{padding-left:20px;position:relative}.rules li::before{content:"";position:absolute;left:3px;top:.68em;width:8px;height:8px;border-radius:50%;background:var(--c)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}.badge{margin-left:8px;background:var(--c);color:#fff;font-size:.65rem;padding:2px 8px;border-radius:999px}
blockquote{margin:0;color:var(--red);font-weight:500;font-size:1.1rem}
details.m>summary,details.full>summary{cursor:pointer;font-weight:600;list-style:none}details.m>summary{font-size:1.1rem}.body{display:flex;flex-direction:column;gap:12px;margin-top:12px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}.how,.conn{border:1px solid var(--line);border-radius:12px;padding:14px 16px}.conn{background:var(--brand);color:#fff}.conn h4{color:#F8DC5A}
.how ol{margin:6px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:8px}details.full{border:1.5px solid var(--line);border-radius:12px;padding:12px 16px;display:flex;flex-direction:column;gap:14px}
.guide{background:var(--bg)}.guide h4{font-size:1.1rem}.obj{color:var(--mut)}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}.steps>li>label{display:flex;gap:10px;align-items:center;cursor:pointer;font-weight:600}
.steps input{position:absolute;opacity:0}.n{flex:none;width:28px;height:28px;border-radius:50%;background:var(--sand);display:grid;place-items:center;font-size:.8rem;color:var(--red)}
.steps input:checked+.n{background:var(--c);color:#fff}.steps li.done .st{text-decoration:line-through;opacity:.6}.steps input:focus-visible+.n{outline:2px solid var(--red);outline-offset:2px}
.steps ul{margin:6px 0 0 38px;padding-left:16px;color:var(--mut)}
.tips{background:var(--sand);border-radius:10px;padding:12px 16px}.tips ul{margin:6px 0 0;padding-left:18px}
.shot{border:2px dashed var(--line);border-radius:10px;padding:18px;text-align:center;color:var(--mut);font-size:.85rem}
.empty{color:var(--mut);padding:24px;text-align:center;background:var(--sf);border:1px dashed var(--line);border-radius:12px}
.pager{display:flex;justify-content:space-between;margin-top:24px}.pager a{text-decoration:none;border:1.5px solid var(--line);background:var(--sf);padding:8px 18px;border-radius:999px;font-weight:500}
.rh{font-size:1.3rem;margin-bottom:14px}.results{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.results a{display:flex;flex-direction:column;text-decoration:none;background:var(--sf);border:1px solid var(--line);border-left:5px solid var(--c);border-radius:10px;padding:12px 16px}.tag{font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--mut)}
.flash{animation:fl 2s}@keyframes fl{0%{box-shadow:0 0 0 4px var(--red)}100%{box-shadow:0 0 0 0 transparent}}
.bar,.cover,.chap h2{display:none}.print .bar{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--sand);padding:10px 16px;border-radius:12px;margin-bottom:16px}.print .bar button{background:var(--brand);color:#fff;border:0;border-radius:999px;padding:9px 18px;font:inherit;cursor:pointer}
.print .cover{display:block;padding:60px 0;border-bottom:3px solid var(--brand);margin-bottom:24px}.print .cover h1{font-size:2.8rem;margin:10px 0}.toc{margin-top:24px;padding-left:20px;columns:2}
.print .chap{margin-top:28px}.print .chap>h1{border-left:8px solid var(--c);padding-left:14px}.print .chap>.d{color:var(--mut);margin:4px 0 12px 22px}
.print .chap h2{display:block;font-size:1rem;letter-spacing:.1em;text-transform:uppercase;color:var(--c);margin:20px 0 10px;border-bottom:2px solid var(--c);padding-bottom:4px}
@media(max-width:640px){.flow{flex-direction:column;align-items:stretch}.flow li{flex-direction:column;align-items:stretch}.flow li:not(:last-child)::after{content:"↓";text-align:center}.toc{columns:1}}
@page{size:A4;margin:16mm 14mm;@bottom-center{content:"Manual Next01 · " counter(page);font:9pt sans-serif;color:#666}}
@media print{
 :root{--bg:#fff;--sf:#fff;--sand:#EEF1F9;--line:#C9D1E8;--ink:#0C1A4B;--mut:#444;--brand:#01135D;--red:#B81D2C}
 body{font-size:10.5pt;-webkit-print-color-adjust:exact;print-color-adjust:exact}.top,.bar,.shot,.pager,.ver{display:none!important}
 main{padding:0;max-width:none}.cover{page-break-after:always}.chap{page-break-before:always}
 .block,.guide,details.m,.fcard,.how,.conn,.steps>li{break-inside:avoid}.guide,details.full{border-radius:6px}details>summary::marker{content:""}
 .callout,.conn,.flow li.hi span,.chips li.hi{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}

.brand{flex-direction:row;align-items:center;gap:10px}.bt{display:flex;flex-direction:column}.logo{height:38px;width:auto;display:block}
.hasLogo .bt b{display:none}.cover .logo{height:64px;margin-bottom:18px}
.ver{padding-block:18px 28px;font-size:.75rem;color:var(--mut);text-align:center}

/* v2.0 · identidade Next01 */
:root{--red:#CD1D50;--navy:#1B2540}
.top{background:var(--navy);border-bottom:0}.top .brand,.top .brand b{color:#fff}.top .brand span{color:#AEB9DD}
.top #q{background:#2A3659;border-color:#3A4876;color:#fff}.top #q::placeholder{color:#AEB9DD}
.pdf{background:var(--red)}
.navr{display:flex;gap:4px;overflow-x:auto;padding-bottom:8px;scrollbar-width:thin}.navr a{white-space:nowrap;color:#C9D2EF;text-decoration:none;padding:7px 14px;border-radius:999px;font-size:.88rem;font-weight:500}.navr a[aria-current=true]{background:var(--red);color:#fff}
.brand .logo{height:34px}.hero .logo.xl{height:64px;margin-bottom:16px}.hero{background:linear-gradient(135deg,#0A1130 0%,#1B2A6B 100%);margin-bottom:20px}
.hero h1{max-width:none}
.cols3{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;margin-bottom:8px}
.gh{font-size:.8rem;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);margin:22px 0 10px}
.cta{margin-top:20px;background:var(--navy);color:#fff;border-radius:14px;padding:24px;display:flex;flex-direction:column;gap:6px;align-items:flex-start}.cta a{background:var(--red);color:#fff;text-decoration:none;padding:9px 18px;border-radius:999px;font-weight:500;margin-top:6px}
.tiles{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.tile{display:flex;flex-direction:column;gap:4px;height:100%;text-decoration:none;background:var(--sf);border:1px solid var(--line);border-left:5px solid var(--navy);border-radius:12px;padding:14px 16px}.tile:hover{border-color:var(--red)}.tile h3{font-size:1.02rem}.tile p{font-size:.85rem;color:var(--mut)}.tile.prep{opacity:.78;border-left-color:var(--line)}
.bd{align-self:flex-start;margin-top:auto;font-size:.68rem;background:var(--sand);padding:2px 10px;border-radius:999px;color:var(--mut)}
.back{display:inline-block;margin-bottom:10px;font-size:.88rem;color:var(--mut);text-decoration:none}
.mhead{border-left:6px solid var(--red)}
.sub{background:var(--sf);border:1px solid var(--line);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:12px}.sub h3{font-size:1.25rem}.path{font-size:.82rem;color:var(--mut)}
.sub h4.lay{font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--red);margin-top:4px}
.tela{margin:0;display:flex;flex-direction:column;gap:10px}.imgw{position:relative;width:fit-content;max-width:100%}.imgw img{display:block;max-width:100%;height:auto;border:1px solid var(--line);border-radius:8px}
.pin{position:absolute;transform:translate(-50%,-50%);width:26px;height:26px;border-radius:50%;background:var(--red);color:#fff;border:2px solid #fff;font:600 .75rem var(--f);cursor:pointer;box-shadow:0 2px 6px #0007;padding:0}
.legend{counter-reset:l;list-style:none;margin:0;padding:0;display:grid;gap:6px}.legend li{counter-increment:l;position:relative;padding:8px 12px 8px 42px;background:var(--bg);border-radius:8px}
.legend li::before{content:counter(l);position:absolute;left:10px;top:8px;width:22px;height:22px;border-radius:50%;background:var(--red);color:#fff;font-size:.72rem;font-weight:600;display:grid;place-items:center}.legend li.on{outline:2px solid var(--red)}
.area{display:flex;flex-direction:column;gap:12px;border-top:5px solid var(--c);padding-top:14px}.area .d{color:var(--mut)}
.layer a{color:var(--red)}
.print .cover{background:var(--navy);color:#fff;border-radius:14px;padding:50px 36px;border:0}.print .cover .logo{height:60px}.print .cover .toc{color:#C9D2EF}
.print .chap .d{margin-left:0}.print .hero{background:var(--navy)}
@media print{.print .cover,.hero,.cta{-webkit-print-color-adjust:exact;print-color-adjust:exact}.pin{box-shadow:none}.cta a,.tile .bd{display:none}.sub{break-inside:auto}.tela{break-inside:avoid}}
.tela figcaption{font-size:.84rem;color:var(--mut)}

.navr{scrollbar-width:none;flex-wrap:wrap;gap:2px 4px}.navr::-webkit-scrollbar{display:none}.navr{gap:2px}.navr a{padding:6px 9px;font-size:.82rem}
@media(max-width:900px){.navr{flex-wrap:nowrap;overflow-x:auto}}
.seg{margin:8px 0 18px;--c:var(--navy)}.fields{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:6px}.cap{color:var(--mut);font-size:.9rem;font-weight:500;margin-top:6px}
.chap h3.lay2{font-size:.8rem;letter-spacing:.1em;text-transform:uppercase;color:var(--red);margin:16px 0 8px}
.tile .tl{display:flex;flex-direction:column;gap:4px;text-decoration:none;color:inherit}.tile:has(.tl):hover{border-color:var(--red)}
.tlay{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto;padding-top:10px}.tlay a{font-size:.7rem;padding:4px 11px;border-radius:999px;background:var(--sand);color:var(--mut);text-decoration:none;opacity:.65}.tlay a.on{background:var(--brand);color:#fff;opacity:1}.tlay a:hover{outline:2px solid var(--red)}
.tiles.cards{grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}.mcard .tl h3{font-size:1.3rem;margin:2px 0}.mcard .tl{gap:6px}.mcard.prep{opacity:.82}
.mcard .tlay a.on{background:var(--c);color:#fff}.mcard .tlay a:hover{outline:2px solid var(--c)}
.mcard .tl{display:flex;flex-direction:column;gap:6px;text-decoration:none;color:var(--ink)}.mcard .tl:hover h3{color:var(--c)}.mcard .tlay{gap:5px}.mcard .tlay a{padding:4px 9px;font-size:.67rem;white-space:nowrap}
.mhead.col{border-left-color:var(--c)}.mhead .seg{--c:inherit;margin:14px 0 4px}.mhead .seg a{padding:9px 18px;font-size:.95rem}.mhead+.layer{margin-top:18px}
</style>
</head>
